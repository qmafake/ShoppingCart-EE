plugins {
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'com.equalexperts'
version = '0.0.1-SNAPSHOT'

description = 'Shopping Cart Service'

java {
    sourceCompatibility = '18'
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://company/com/maven2")
    }
    mavenLocal()
    flatDir {
        dirs "libs"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.slf4j:jcl-over-slf4j:2.0.3'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'com.konghq:unirest-java:3.13.1'

//    compileOnly "org.projectlombok:lombok:1.18.36"

//    annotationProcessor 'org.projectlombok:lombok:1.18.36'
//    testCompileOnly 'org.projectlombok:lombok:1.18.36'
//    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

//    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
//    runtimeOnly 'com.h2database:h2'
    //TODO: Remove


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}


jar {
    manifest {
        attributes "Main-Class": "com.equalexperts.shoppingcart.ShoppingCartApplication"
    }
}